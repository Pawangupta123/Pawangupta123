name: Generate Snake

on:
  # Refresh the snake once a day so it stays current.
  schedule:
    - cron: "0 0 * * *"
  # Lets you trigger it by hand the first time, from the Actions tab.
  workflow_dispatch:
  # Also regenerate whenever you push to main.
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
